# @package _group_

batch_size: 10
val_batch_size: 2
num_workers: 3

train:
  indir: ${location.data_root_dir}/train
  img_suffix: .png
  out_size: 256
  mask_generator_kind: predefined  # Set to "predefined" to use custom masks
  mask_file_suffix: _mask  # Suffix for the mask files
  # If you want to go back to generated masks, comment out the above two lines
  # and uncomment the mask_gen_kwargs section below
  
  # mask_gen_kwargs:  # probabilities do not need to sum to 1, they are re-normalized in mask generator
  #   irregular_proba: 1
  #   irregular_kwargs:
  #     max_angle: 4
  #     max_len: 200
  #     max_width: 100
  #     max_times: 5
  #     min_times: 1
  #
  #   box_proba: 1
  #   box_kwargs:
  #     margin: 10
  #     bbox_min_size: 30
  #     bbox_max_size: 150
  #     max_times: 4
  #     min_times: 1
  #
  #   segm_proba: 0

  transform_variant: distortions
  dataloader_kwargs:
    batch_size: ${data.batch_size}
    shuffle: True
    num_workers: ${data.num_workers}

val:
  indir: ${location.data_root_dir}/val
  img_suffix: .png
  mask_generator_kind: predefined  # Set to "predefined" to use custom masks
  mask_file_suffix: _mask  # Suffix for the mask files
  dataloader_kwargs:
    batch_size: ${data.val_batch_size}
    shuffle: False
    num_workers: ${data.num_workers}

visual_test:
  indir: ${location.data_root_dir}/visual_test
  img_suffix: .png
  mask_generator_kind: predefined  # Set to "predefined" to use custom masks
  mask_file_suffix: _mask  # Suffix for the mask files
  pad_out_to_modulo: 32
  dataloader_kwargs:
    batch_size: 1
    shuffle: False
    num_workers: ${data.num_workers}
